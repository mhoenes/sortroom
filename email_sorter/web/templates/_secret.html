{# where a login or key comes from; never its value #}
{% macro source(s) -%}
{%- if s.source == 'file' %}<span class="pill ok">{{ _('stored') }}</span>
{%- elif s.source == 'env' %}<span class="pill ok">{{ _('from .env') }}</span>&nbsp;<span class="mono">{{ s.env }}</span>
{%- else %}<span class="pill err">{{ _('missing') }}</span>{% endif -%}
{%- endmacro %}
