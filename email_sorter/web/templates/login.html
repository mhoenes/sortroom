<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden · Sortroom</title>
<link rel="stylesheet" href="{{ asset('app.css') }}">
<link rel="icon" href="{{ asset('icon-small.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ asset('icon-32.png') }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}">
<link rel="manifest" href="/ui/static/manifest.webmanifest">
<meta name="theme-color" content="#1B1A17">
</head>
<body>
<div class="login">
  <form class="card" method="post" action="/login">
    <img src="{{ asset('icon.svg') }}" alt="" width="48" height="48">
    <div style="display:flex;flex-direction:column;gap:4px">
      <h1>Sortroom</h1>
      <span class="muted">Administration</span>
    </div>
    {% if not configured %}
      <p class="error" role="alert">Die Anmeldung ist gesperrt: In der <code>.env</code> fehlt <code>ADMIN_PASSWORD</code> (mindestens 8 Zeichen). Danach den Container neu starten.</p>
    {% else %}
      <label class="f">Passwort
        <input type="password" name="password" autocomplete="current-password" autofocus required>
      </label>
      {% if error %}<p class="error" role="alert" style="margin:0">{{ error }}</p>{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn primary" type="submit">Anmelden</button>
    {% endif %}
  </form>
  <a class="source-login" href="{{ source_url }}" target="_blank" rel="noopener">Sortroom v{{ version }} ist freie Software (AGPL-3.0) · Quellcode</a>
</div>
</body>
</html>
