{% if j.status == 'running' %}<span class="pill info">läuft</span>
{% elif j.status == 'rejected' %}<span class="pill warn">nicht gestartet</span>
{% elif j.status == 'failed' %}<span class="pill err">Fehler</span>
{% elif j.result and j.result.ok is false %}<span class="pill warn">mit Fehlern</span>
{% elif j.result and j.result.live is false %}<span class="pill">Probelauf</span>
{% else %}<span class="pill ok">fertig</span>{% endif %}
