# email-sorter configuration
# Secrets (IMAP password, OpenRouter key) live in .env, not here.

[imap]
host = "imap.strato.de"
port = 993
source_folder = "INBOX"

[jev]
# OpenRouter (decisions API, alpha)
endpoint = "https://openrouter.ai/api/alpha/decisions"
model = "typesafe/jev-1.13"
api_key_env = "OPENROUTER_API_KEY"   # name of the .env variable holding the key
# Vercel AI Gateway alternative:
# endpoint = "https://ai-gateway.vercel.sh/typesafe/v1/systemone"
# model = "typesafe-ai/jev"
# api_key_env = "AI_GATEWAY_API_KEY"
max_body_chars = 3000     # body text sent to Jev is cut to this length
timeout_seconds = 20
min_interval_seconds = 0    # pause between requests; OpenRouter needs none.
                            # For Vercel use 2.0: it rate-limits per minute, shorter gaps
                            # trigger 40-60 s forced waits and end up slower

[rules]
min_confidence = 0.70         # below this, mail stays in the inbox untouched
action_flag_threshold = 0.80  # "needs action" probability at/above this -> mail gets flagged
expiry_threshold = 0.70       # "time-limited offer" probability at/above this -> expiry date is tracked
expired_keyword = "abgelaufen" # IMAP tag set once a tracked offer has expired
expired_folder = "INBOX/Werbung/Abgelaufen"  # expired offers are moved here; remove to only tag
lookback_days = 7             # only look at mail received in the last N days
min_age_hours = 24            # leave mail alone until it has been in the inbox this long (0 = sort at once)
max_per_run = 200             # safety cap on mails classified per run

# ---------------------------------------------------------------------------
# Categories
#   description  what Jev reads to decide - the more precise, the better
#   folder       target folder ("/" is translated to the server's separator);
#                omit to leave the mail in the inbox
#   flag         true = always flag mails of this category
#   flag_on_action  false = never flag because of "needs action" (default true);
#                   for advertising ("voucher expires!") and anything suspicious
#   track_expiry  true = find the end date of time-limited offers; the day after it
#                 has passed, tag the mail with expired_keyword and move it to expired_folder
# Order does not matter. Keys must be unique, lowercase, no spaces.
# ---------------------------------------------------------------------------

[categories.finanzen]
description = "Anything about money owed or paid: invoices and bills of any kind (including electricity, gas, water, phone and internet bills), receipts, direct debit notices, bank and credit card statements, insurance premiums, taxes, payment reminders, dunning letters"
folder = "INBOX/Finanzen"

[categories.bestellungen]
description = "Online shop order confirmations, shipping and delivery notifications, parcel tracking, returns and refunds of orders"
folder = "INBOX/Bestellungen"

[categories.reisen]
description = "Travel bookings, train/flight/event tickets, hotel and rental confirmations, check-in reminders, appointment confirmations and reminders"
folder = "INBOX/Reisen"

[categories.vertraege]
description = "Contract matters that are not a bill: new contracts, contract changes, price change announcements, terminations and renewals with utility, internet or mobile providers; landlord and housing; government, authorities and official letters"
folder = "INBOX/Verträge"

[categories.werbung]
description = "Marketing and editorial mail sent to many recipients: newsletters, advertising, promotions, discounts, vouchers and coupons, sales, product and event announcements (e.g. new concerts or shows), subscription upgrade or renewal offers, club and association newsletters and member invitations, general service announcements to all customers. Not job alerts, social network digests or notifications about the recipient's own accounts"
folder = "INBOX/Werbung"
flag_on_action = false
track_expiry = true

[categories.benachrichtigungen]
description = "Automated notifications about the recipient's own accounts, devices and activity: social and career networks (LinkedIn, Xing, Instagram: job alerts and recommendations, 'hiring near you', 'open to work', birthdays, follow suggestions, network digests), likes and comments, price alerts and wishlist price drops, requests to rate or review a purchase or trip, genealogy and record hints, app and smart home alerts, server and device status mails (updates, backups, errors), family safety reports"
folder = "INBOX/Benachrichtigungen"
flag_on_action = false

[categories.portal]
description = "Notice that a new document or message is waiting in an online customer portal or postbox (bank PostBox, health insurance mailbox, tenant or property management portal), without the document itself"
flag_on_action = false
# no folder: stays in the inbox so documents waiting in portals are not overlooked

[categories.persoenlich]
description = "Personal mail written by a real person to the recipient: friends, family, acquaintances, private conversations"
# no folder: stays in the inbox

[categories.sicherheit]
description = "Genuine account security mail sent from the service's own official domain: password resets, login alerts, new device sign-ins, two-factor and verification codes, account changes"
flag = true

[categories.verdaechtig]
description = "Phishing, scams and fraud: fake account warnings, suspended or locked account claims, urgent requests to log in, verify or pay, sender domain that does not belong to the brand it names, misspelled brand names (e.g. AppIe, PayPaI), unexpected prizes, inheritances, crypto or investment offers"
folder = "INBOX/Verdächtig"
flag_on_action = false   # never star suspicious mail

[categories.sonstiges]
description = "Anything that clearly fits none of the other categories"
