# Sortroom: admin UI, built-in schedule and HTTP API in one container.
#
# The UI is published on the host (http://<host>:8765, login with ADMIN_PASSWORD);
# set UI_PORT in .env to use another port. Runs start by themselves (Settings -> Schedule).

services:
  sortroom:
    # Prebuilt image from GitHub Container Registry. :latest is the latest release; pin a
    # version (e.g. :0.13) or use a fork by editing this line or setting SORTROOM_IMAGE in .env.
    # :edge follows the main branch (not released yet, may break).
    # Update: docker compose pull && docker compose up -d
    # To build locally instead: docker build -t sortroom .  and set
    # SORTROOM_IMAGE=sortroom.
    image: ${SORTROOM_IMAGE:-ghcr.io/mhoenes/sortroom:latest}
    container_name: sortroom
    ports:
      - "${UI_PORT:-8765}:8765"
    restart: unless-stopped
    env_file: .env  # also PUID / PGID: the user and group Sortroom runs as (default 1000)
    environment:
      TZ: Europe/Berlin  # your time zone: expiry dates, "today" and the times in the UI follow it
    volumes:
      - ./config:/app/config        # config.toml (shared settings) and secrets.toml (API key), editable under "Global settings"
      - ./mailboxes:/app/mailboxes  # one folder per mailbox: mailbox.toml, data/state.db, reports/
      - ./logs:/app/logs
