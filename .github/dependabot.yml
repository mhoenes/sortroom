# Proposes updates of the GitHub Actions pinned in .github/workflows and of the Dockerfile's base image digest
# (a pull request a month at most).
# Python packages are pinned in requirements-lock.txt and updated by hand (see its header).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
