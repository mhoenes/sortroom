# Sortroom: settings shared by all mailboxes, editable under "Global settings".
# Each mailbox has its own mailboxes/<id>/mailbox.toml, created in the UI via "Add mailbox".
# The API key is not kept here: it is set under Global settings and stored in secrets.toml.

# The model that files the mails: any service that speaks the TypeSafe API
# (https://docs.typesafe.ai/api), hosted or self-hosted.
[classifier]
endpoint = "https://openrouter.ai/api/alpha/decisions"
model = "typesafe/jev-1.13"
max_body_chars = 3000       # body text sent to the model is cut to this length
timeout_seconds = 20
min_interval_seconds = 0    # pause between requests, for providers that limit requests per minute

# Language of the admin UI ("en" or "de", default "en") and its appearance ("auto" follows the
# system setting of each device, "light" or "dark"); both also under Global settings.
# [ui]
# language = "de"
# theme = "dark"

# Mail Sortroom sends itself (also under Global settings → Mail): a note when a scheduled task fails,
# and a daily summary. The password goes in secrets.toml ([smtp] password), set in the UI.
# [mail]
# host = "smtp.example.com"
# port = 587
# security = "starttls"          # starttls, ssl (port 465) or none
# user = "me@example.com"
# sender = "Sortroom <me@example.com>"
# recipient = "me@example.com"
# ui_url = "http://nas:8765"     # for links in the mails
# notify_failures = true
# digest = true
# digest_time = "07:00"
