# Sortroom: settings shared by all mailboxes. Each mailbox has its own
# mailboxes/<id>/mailbox.toml (created in the UI via "Postfach hinzufügen").
# Secrets (API keys) live in .env, not here.

# The model that files the mails: any service that speaks the TypeSafe API
# (https://docs.typesafe.ai/api). Its API key is CLASSIFIER_API_KEY in .env.
[classifier]
endpoint = "https://openrouter.ai/api/alpha/decisions"
model = "typesafe/jev-1.13"
max_body_chars = 3000       # body text sent to the model is cut to this length
timeout_seconds = 20
min_interval_seconds = 0    # pause between requests, for providers that limit requests per minute
